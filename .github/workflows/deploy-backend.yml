name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Configure git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 2. Clone the Hugging Face Space repository using the Access Token
          git clone https://AmanSoni45:$HF_TOKEN@huggingface.co/spaces/AmanSoni45/slip-backend hf-space

          # 3. Clean out old files in the space repo (except the .git folder)
          find hf-space -maxdepth 1 ! -name 'hf-space' ! -name '.git' -exec rm -rf {} +

          # 4. Copy new backend files from GitHub repository to the Space repository root
          cp -r backend/* hf-space/

          # 5. Commit and push the changes to Hugging Face
          cd hf-space
          git add .
          
          # Check if there are changes before committing
          if git diff-index --quiet HEAD --; then
            echo "No changes to deploy."
          else
            git commit -m "Auto-deploy backend from GitHub Action [skip ci]"
            git push origin main
          fi
